name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build workers (compile)
        working-directory: workers
        run: mvn -q -DskipTests compile

      - name: Validate BPMN files
        run: |
          fail=0
          for f in $(find process -name "*.bpmn"); do
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" || { echo "FAIL xml: $f"; fail=1; }
            grep -q "bpmn:process\|<process " "$f" || { echo "FAIL no-process: $f"; fail=1; }
            [ "$fail" -eq 0 ] && echo "PASS: $f"
          done
          exit $fail
