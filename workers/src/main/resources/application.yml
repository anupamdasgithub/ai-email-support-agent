spring:
  application:
    name: bank-ai-loan-approval

camunda:
  client:
    mode: self-managed
    zeebe:
      defaults:
        force-fetch-all-variables: true
    auth:
      client-id: orchestration
      client-secret: secret
      token-url: http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
    grpc-address: grpc://localhost:26500
    # Camunda 8.8 stack publishes orchestration on host port 8088 (container 8080).
    rest-address: http://localhost:8088
    # gRPC avoids the REST JSON schema drift between the 8.9 client and 8.8 server
    # (e.g. "Request property [tenantFilter] cannot be parsed" on /v2/jobs/activation).
    prefer-rest-over-grpc: false

# RAG pipeline wiring. Workers run as a local JVM process (not inside the Docker
# network), so the embeddings service and Elasticsearch are reached via their
# published host ports on localhost, NOT their in-network container hostnames.
embeddings:
  service:
    url: http://localhost:8000

elasticsearch:
  host: localhost
  port: 9200
  scheme: http

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    # io.grpc at DEBUG dumps every HTTP/2 frame; ActivateJobs long-polls every
    # ~20s, so it floods the console and hides the startup banner.
    io.grpc: WARN
    io.camunda: INFO
    # Keep our own code verbose - this is the signal we actually want.
    io.camunda.example.loan.rag: DEBUG
    io.camunda.example.loan.worker: DEBUG

server:
  port: 8090
